# Apptrix Community Build release metadata.
#
# The download page renders live buttons when `baseURL` is set. Until then it
# shows a "coming soon" notice rather than dead links.
#
# Each download URL is resolved by the download layout as:
#   {baseURL}/{slug}/Apptrix_org-{slug}-{commit}.{ext}
#
# These point at the latest Community Build published to build-artifacts.apptrix.ai.
# When a new build is published, update `commit` ONLY — every platform link is
# derived from it.

baseURL = "https://build-artifacts.apptrix.ai/github/andydotxyz/ApptrixAI/Apptrix/latest"
commit = "1023b1a"

[[platforms]]
  os = "macOS"
  arch = "Apple Silicon (M-series)"
  slug = "darwin-arm64"
  ext = "zip"

[[platforms]]
  os = "macOS"
  arch = "Intel processor"
  slug = "darwin-amd64"
  ext = "zip"

[[platforms]]
  os = "Windows"
  arch = "64-bit x86"
  slug = "windows-amd64"
  ext = "exe.zip"

[[platforms]]
  os = "Linux"
  arch = "AMD64"
  slug = "linux-amd64"
  ext = "tar.xz"

[[platforms]]
  os = "Linux"
  arch = "ARM64"
  slug = "linux-arm64"
  ext = "tar.xz"
